<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Signal Screen — Dashboard</title>
<link rel="stylesheet" href="/style.css"/>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="brand" href="/dashboard.html"><div class="mark"></div><span>SIGNAL SCREEN</span></a>
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="tabs">
        <button class="tab active" data-view="builder">Build</button>
        <button class="tab" data-view="responses">Responses</button>
      </div>
      <button class="signout" id="signout">Sign out</button>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
const token = localStorage.getItem('token');
if(!token) window.location.href = '/index.html';
const authHeaders = { 'Authorization': 'Bearer ' + token };

document.getElementById('signout').onclick = () => {
  localStorage.removeItem('token'); localStorage.removeItem('recruiter');
  window.location.href = '/index.html';
};

const stage = document.getElementById('stage');
const tabs = document.querySelectorAll('.tab');
let view = 'builder';
let draft = { title:'', questions:[''] };
let forms = [];
let activeFormId = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function api(path, opts={}){
  const r = await fetch('/api'+path, { ...opts, headers: { ...authHeaders, ...(opts.headers||{}) } });
  if(r.status === 401){ localStorage.clear(); window.location.href = '/index.html'; return; }
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}

tabs.forEach(t=>t.addEventListener('click', ()=>{
  tabs.forEach(x=>x.classList.remove('active')); t.classList.add('active');
  view = t.dataset.view; render();
}));

async function render(){
  if(view==='builder') await renderBuilder();
  else await renderResponses();
}

async function renderBuilder(){
  try{ forms = await api('/forms'); }catch(e){ forms = []; }

  const rows = draft.questions.map((q,i)=>`
    <div class="q-row" data-idx="${i}">
      <div class="q-num">Q${String(i+1).padStart(2,'0')}</div>
      <textarea placeholder="Ask something a real interviewer would ask...">${escapeHtml(q)}</textarea>
      <button class="rm" title="Remove question">&times;</button>
    </div>`).join('');

  const formListRows = forms.map(f=>`
    <div class="form-list-item">
      <div>
        <h3>${escapeHtml(f.title)}</h3>
        <span class="meta">${f.questionCount} question${f.questionCount===1?'':'s'} · ${f.responseCount} response${f.responseCount===1?'':'s'} · ${new Date(f.created_at).toLocaleDateString()}</span>
      </div>
      <span class="code-pill">${f.code}</span>
    </div>`).join('');

  stage.innerHTML = `
    <h1 class="page-title">Build a screening form</h1>
    <p class="subtitle">Write the questions once, share a code, get back recorded answers instead of booking a call.</p>

    <div class="card">
      <label>Form title</label>
      <input type="text" id="ftitle" placeholder="e.g. Senior Backend Engineer — First Screen" value="${escapeHtml(draft.title)}"/>
    </div>

    <div class="card">
      <label>Questions</label>
      <div id="qlist">${rows}</div>
      <div style="margin-top:14px;display:flex;gap:10px;">
        <button class="btn btn-ghost" id="addq">+ Add question</button>
        <button class="btn btn-primary" id="saveform" style="margin-left:auto;">Publish form</button>
      </div>
    </div>

    <h1 class="page-title" style="font-size:20px;margin-top:36px;">Your forms</h1>
    <div class="card" style="padding:6px 22px;">
      ${formListRows || '<div class="empty">Published forms will appear here with a shareable code.</div>'}
    </div>
  `;

  document.getElementById('ftitle').oninput = e => draft.title = e.target.value;
  document.getElementById('addq').onclick = () => { draft.questions.push(''); renderBuilder(); };
  document.querySelectorAll('#qlist textarea').forEach(ta=>{
    ta.oninput = e => { draft.questions[+e.target.closest('.q-row').dataset.idx] = e.target.value; };
  });
  document.querySelectorAll('#qlist .rm').forEach(btn=>{
    btn.onclick = e => {
      const idx = +e.target.closest('.q-row').dataset.idx;
      draft.questions.splice(idx,1);
      if(draft.questions.length===0) draft.questions.push('');
      renderBuilder();
    };
  });
  document.getElementById('saveform').onclick = async () => {
    const title = draft.title.trim();
    const questions = draft.questions.map(q=>q.trim()).filter(Boolean);
    if(!title) return toast('Give the form a title first');
    if(questions.length===0) return toast('Add at least one question');
    try{
      const res = await api('/forms', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({title, questions}) });
      draft = { title:'', questions:[''] };
      toast('Form published — code ' + res.code);
      renderBuilder();
    }catch(e){ toast(e.message); }
  };
}

async function renderResponses(){
  try{ forms = await api('/forms'); }catch(e){ forms = []; }
  if(!activeFormId && forms.length) activeFormId = forms[0].id;

  const formOptions = forms.map(f=>`<option value="${f.id}">${escapeHtml(f.title)} (${f.code})</option>`).join('');

  let rows = '';
  if(activeFormId){
    try{
      const list = await api(`/forms/${activeFormId}/responses`);
      rows = list.map(r=>`
        <div class="resp-item">
          <div class="resp-head" data-rid="${r.id}">
            <h4>${escapeHtml(r.candidate_name)}</h4>
            <span class="meta">${new Date(r.submitted_at).toLocaleString()} ${r.consent_given_at ? '· consent recorded' : ''}</span>
          </div>
          <div class="resp-answers" id="ans-${r.id}">
            ${r.answers.map((a,i)=>`
              <div class="resp-q">Q${String(i+1).padStart(2,'0')} · ${escapeHtml(a.questionText)}</div>
              <audio controls src="${a.audioUrl}" data-auth></audio>
            `).join('')}
          </div>
        </div>`).join('');
    }catch(e){ rows = `<div class="empty">Could not load responses.</div>`; }
  }

  stage.innerHTML = `
    <h1 class="page-title">Responses</h1>
    <p class="subtitle">Review recorded answers instead of running a first-round call.</p>
    ${forms.length ? `
      <div class="card">
        <label>Form</label>
        <select id="formsel">${formOptions}</select>
      </div>
      <div class="card">${rows || '<div class="empty">No submissions yet for this form.</div>'}</div>
    ` : `<div class="empty">Publish a form first to see responses here.</div>`}
  `;

  const sel = document.getElementById('formsel');
  if(sel){
    sel.value = activeFormId;
    sel.onchange = e => { activeFormId = e.target.value; renderResponses(); };
  }
  document.querySelectorAll('.resp-head').forEach(h=>{
    h.onclick = () => document.getElementById('ans-'+h.dataset.rid).classList.toggle('open');
  });

  // Audio elements need the auth token — fetch as blob and swap in an object URL
  document.querySelectorAll('audio[data-auth]').forEach(async el => {
    try{
      const r = await fetch(el.getAttribute('src'), { headers: authHeaders });
      const blob = await r.blob();
      el.src = URL.createObjectURL(blob);
    }catch(e){}
  });
}

render();
</script>
</body>
</html>
