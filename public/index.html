<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Signal — Sign in</title>
<link rel="stylesheet" href="/style.css"/>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="mark"></div><span>SIGNAL</span></div>
  </div>
  <div class="stage narrow">
    <h1 class="page-title" id="title">Sign in</h1>
    <p class="subtitle">Collect voice answers instead of typed ones — for surveys, screenings, research and more.</p>

    <div class="auth-toggle">
      <button class="tab active" id="tablogin">Sign in</button>
      <button class="tab" id="tabregister">Create account</button>
    </div>

    <div class="card" id="loginform">
      <label>Email</label>
      <input type="email" id="lemail"/>
      <label>Password</label>
      <input type="password" id="lpassword"/>
      <div class="error" id="lerror" style="display:none;"></div>
      <button class="btn btn-primary" id="lsubmit" style="width:100%;">Sign in</button>
    </div>

    <div class="card" id="registerform" style="display:none;">
      <label>Your name</label>
      <input type="text" id="rname"/>
      <label>Organization / team name</label>
      <input type="text" id="rorg"/>
      <label>Email</label>
      <input type="email" id="remail"/>
      <label>Password</label>
      <input type="password" id="rpassword"/>
      <div class="error" id="rerror" style="display:none;"></div>
      <button class="btn btn-primary" id="rsubmit" style="width:100%;">Create account</button>
    </div>
  </div>
</div>

<script>
if (localStorage.getItem('token')) window.location.href = '/dashboard.html';

const tablogin = document.getElementById('tablogin');
const tabregister = document.getElementById('tabregister');
const loginform = document.getElementById('loginform');
const registerform = document.getElementById('registerform');
const title = document.getElementById('title');

tablogin.onclick = () => {
  tablogin.classList.add('active'); tabregister.classList.remove('active');
  loginform.style.display=''; registerform.style.display='none';
  title.textContent = 'Sign in';
};
tabregister.onclick = () => {
  tabregister.classList.add('active'); tablogin.classList.remove('active');
  registerform.style.display=''; loginform.style.display='none';
  title.textContent = 'Create your account';
};

document.getElementById('lsubmit').onclick = async () => {
  const email = document.getElementById('lemail').value.trim();
  const password = document.getElementById('lpassword').value;
  const err = document.getElementById('lerror');
  err.style.display = 'none';
  try {
    const r = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await r.json();
    if(!r.ok) { err.textContent = data.error || 'Sign in failed'; err.style.display=''; return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('recruiter', JSON.stringify(data.recruiter));
    window.location.href = '/dashboard.html';
  } catch(e) { err.textContent = 'Could not reach the server'; err.style.display=''; }
};

document.getElementById('rsubmit').onclick = async () => {
  const name = document.getElementById('rname').value.trim();
  const orgName = document.getElementById('rorg').value.trim();
  const email = document.getElementById('remail').value.trim();
  const password = document.getElementById('rpassword').value;
  const err = document.getElementById('rerror');
  err.style.display = 'none';
  try {
    const r = await fetch('/api/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, orgName, email, password})
    });
    const data = await r.json();
    if(!r.ok) { err.textContent = data.error || 'Could not create account'; err.style.display=''; return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('recruiter', JSON.stringify(data.recruiter));
    window.location.href = '/dashboard.html';
  } catch(e) { err.textContent = 'Could not reach the server'; err.style.display=''; }
};
</script>
</body>
</html>
